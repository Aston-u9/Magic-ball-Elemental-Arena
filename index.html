<!DOCTYPE html>
<html>
<head>
    <title>Magic Ball Arena</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        /* UI AND LAYOUT */
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; color: white; width: 100vw; height: 100vh; }
        .hidden { display: none !important; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        
        /* SETTINGS & HUD */
        #settings-btn { position: absolute; top: 20px; left: 20px; font-size: 30px; z-index: 1001; cursor: pointer; }
        #stat-bars { position: absolute; top: 22px; left: 75px; width: clamp(120px, 25vw, 180px); z-index: 50; pointer-events: none; }
        .bar-container { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .bar-bg { flex-grow: 1; height: 10px; background: #222; border: 1px solid #fff; border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; background: #22c55e; width: 100%; transition: 0.2s; }
        #mc-fill { height: 100%; background: #3b82f6; width: 100%; transition: 0.2s; }
        .stat-text { font-size: 11px; font-weight: bold; min-width: 30px; text-shadow: 1px 1px 2px black; }
        
        #settings-menu { position: absolute; top: 0; left: 0; width: 280px; height: 100%; background: rgba(17,17,17,0.95); z-index: 2000; padding: 20px; transform: translateX(-100%); transition: 0.3s; border-right: 1px solid #444; box-sizing: border-box; }
        #settings-menu.open { transform: translateX(0); }
        .setting-item { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        input[type=range] { width: 100%; cursor: pointer; }

        /* CROSSHAIR */
        #pointer { position: absolute; top: 35%; left: 50%; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #pointer::after { content: ''; position: absolute; top: 50%; left: 50%; width: 2px; height: 2px; background: white; transform: translate(-50%, -50%); }

        /* SCREENS */
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 100; text-align: center; }
        button { padding: 10px 20px; margin: 6px; border-radius: 8px; border: 1px solid white; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        
        /* CONTROLS */
        #action-grid { position: absolute; bottom: 5vh; right: 5vw; display: grid; grid-template-columns: 55px 55px; gap: 12px; z-index: 10; }
        .skill-btn { width: 55px; height: 55px; background: rgba(0,0,0,0.4); border: 1.5px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; touch-action: none; }
        .sq { border-radius: 12px; }
        .cooldown { opacity: 0.3; pointer-events: none; }
        #joy-con { position: absolute; bottom: 5vh; left: 5vw; width: 90px; height: 90px; background: rgba(255,255,255,0.1); border-radius: 50%; touch-action: none; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 40px; height: 40px; background: white; border-radius: 50%; opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div id="pointer"></div>
    <div id="settings-btn" onclick="toggleSettings()">☰</div>
    
    <div id="settings-menu">
        <h2>SETTINGS</h2>
        <div class="setting-item">
            <label>SENSITIVITY</label>
            <input type="range" id="sens-slider" min="1" max="20" value="8" oninput="updateSens(this.value)">
        </div>
        <button onclick="handleBack(); toggleSettings()" style="background:#ef4444; width: 100%;">BACK 🔙</button>
        <button onclick="toggleSettings()" style="margin-top: 20px; width: 100%;">CLOSE</button>
    </div>

    <div id="screen-home" class="screen">
        <h1>MAGIC BALL</h1>
        <button onclick="navTo('screen-element'); window.gameMode='test'">TEST GROUND</button>
        <button onclick="navTo('screen-battle')">BATTLE GROUND</button>
    </div>

    <div id="screen-battle" class="screen hidden">
        <h2>ARENA</h2>
        <button onclick="navTo('screen-element'); window.gameMode='1v1'">1 vs 1</button>
        <button onclick="navTo('screen-element'); window.gameMode='4v4'">4 vs 4</button>
        <button onclick="handleBack()" style="background:gray">BACK</button>
    </div>

    <div id="screen-element" class="screen hidden">
        <h2>ELEMENT</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;" id="el-btns"></div>
        <button onclick="handleBack()" style="background:gray; margin-top: 20px;">BACK</button>
    </div>

    <div id="game-ui" class="hidden">
        <div id="stat-bars">
            <div class="bar-container"><div class="bar-bg"><div id="hp-fill"></div></div><div class="stat-text" id="hp-val">100</div></div>
            <div class="bar-container" style="width: 80%;"><div class="bar-bg"><div id="mc-fill"></div></div><div class="stat-text" id="mc-val">50</div></div>
        </div>
        <div id="joy-con"><div id="joy-knob"></div></div>
        <div id="action-grid">
            <div class="skill-btn" id="btn-a" ontouchstart="cast(1)">A</div>
            <div class="skill-btn sq" ontouchstart="jump()">⬆️</div>
            <div class="skill-btn" id="btn-b" ontouchstart="cast(2)">B</div>
            <div class="skill-btn sq" id="btn-dash" ontouchstart="dash()">⏩</div>
        </div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, player, yaw = 0, pitch = 0.2, moveVector = { x: 0, z: 0 };
        let currentEl = 'fire', hp = 100, mc = 50, dashReady = true, sensitivity = 0.008;
        let isDashing = false, dashTime = 0, dashDir = new THREE.Vector3();
        let moveTouchId = null, lookTouchId = null, lastLookX = 0, lastLookY = 0;
        let screenHistory = ['screen-home'];
        
        const projectiles = [], enemies = [], dashTrails = [];
        const raycaster = new THREE.Raycaster();
        const COLORS = { fire:'#ff4500', water:'#00bfff', lightning:'#ffff00', earth:'#8b4513', wind:'#ffffff', verdant:'#00ff00', light:'#ffffcc', shadow:'#2b0044' };

        window.toggleSettings = () => document.getElementById('settings-menu').classList.toggle('open');
        window.updateSens = (val) => { sensitivity = val * 0.001; };
        window.navTo = (id) => { 
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); 
            document.getElementById(id).classList.remove('hidden'); 
            screenHistory.push(id); 
        };

        window.handleBack = () => { 
            if (screenHistory.length <= 1) return; 
            screenHistory.pop(); 
            const prev = screenHistory[screenHistory.length-1]; 
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); 
            document.getElementById('game-ui').classList.toggle('hidden', prev !== 'game-ui'); 
            document.getElementById(prev).classList.remove('hidden'); 
            if(prev !== 'game-ui') resetGame(); 
        };

        const btnContainer = document.getElementById('el-btns');
        Object.keys(COLORS).forEach(el => { 
            const b = document.createElement('button'); 
            b.style.background = COLORS[el]; 
            b.innerText = el.toUpperCase(); 
            b.onclick = () => { currentEl = el; startGame(); }; 
            btnContainer.appendChild(b); 
        });

        function startGame() { 
            navTo('game-ui'); 
            document.getElementById('game-ui').classList.remove('hidden'); 
            player.material.color.set(COLORS[currentEl]); 
            document.getElementById('btn-a').style.background = COLORS[currentEl]; 
            document.getElementById('btn-b').style.background = COLORS[currentEl]; 
            spawnEnemies(); 
        }

        function resetGame() { 
            enemies.forEach(e => scene.remove(e)); 
            projectiles.forEach(p => scene.remove(p)); 
            enemies.length = 0; 
            projectiles.length = 0; 
            hp = 100; mc = 50; 
            updateBars(); 
        }

        window.cast = (num) => { 
            if (mc < (num === 1 ? 5 : 10)) return; 
            mc -= (num === 1 ? 5 : 10); 
            updateBars(); 
            if (num === 1) spawnP(COLORS[currentEl], 0.9, 45); // Approx 40 units
            else { 
                let i=0; 
                let t=setInterval(()=> { 
                    spawnP(COLORS[currentEl], 0.6, 33); // Approx 20 units
                    if(++i>=40) clearInterval(t); 
                }, 100); 
            } 
        };

        function spawnP(color, speed, life) {
            const group = new THREE.Group();
            group.add(new THREE.Mesh(new THREE.SphereGeometry(0.7), new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.4})));
            group.add(new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 'white'})));
            const pointerNDC = new THREE.Vector2(0, 0.4); 
            raycaster.setFromCamera(pointerNDC, camera);
            const targetWorldPoint = new THREE.Vector3();
            raycaster.ray.at(100, targetWorldPoint);
            const spawnPos = player.position.clone().add(new THREE.Vector3(0, 0.5, 0));
            const direction = new THREE.Vector3().subVectors(targetWorldPoint, spawnPos).normalize();
            group.position.copy(spawnPos);
            group.userData = { vel: direction.multiplyScalar(speed), life };
            scene.add(group); projectiles.push(group);
        }

        window.jump = () => { if(player.position.y <= 1.05) player.userData.vY = 0.45; };

        window.dash = () => {
            if(!dashReady || isDashing) return;
            dashReady = false; isDashing = true; dashTime = 8; 
            document.getElementById('btn-dash').classList.add('cooldown');
            dashDir = (moveVector.x !== 0 || moveVector.z !== 0) ? new THREE.Vector3(moveVector.x, 0, moveVector.z).applyAxisAngle(new THREE.Vector3(0,1,0), yaw).normalize() : new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
            const dashOpposite = dashDir.clone().negate();
            for(let i=0; i<8; i++) {
                const line = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 6), new THREE.MeshBasicMaterial({color: 'white', transparent: true, opacity: 0.9}));
                const offset = new THREE.Vector3((Math.random()-0.5)*1.2, (Math.random()-0.5)*1.2, (Math.random()-0.5)*1.2).add(dashOpposite.clone().multiplyScalar(3.5));
                line.userData = { offset, direction: dashOpposite };
                scene.add(line); dashTrails.push({ m: line, life: 12 });
            }
            setTimeout(() => { dashReady = true; document.getElementById('btn-dash').classList.remove('cooldown'); }, 1000);
        };

        function updateBars() { 
            document.getElementById('hp-fill').style.width = hp + '%'; 
            document.getElementById('hp-val').innerText = Math.floor(hp); 
            document.getElementById('mc-fill').style.width = (mc/50)*100 + '%'; 
            document.getElementById('mc-val').innerText = Math.floor(mc); 
        }

        function spawnEnemies() { 
            const count = window.gameMode === '4v4' ? 7 : (window.gameMode === '1v1' ? 1 : 0); 
            for(let i=0; i<count; i++) { 
                const e = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshStandardMaterial({color: '#000'})); 
                e.position.set(Math.random()*60-30, window.gameMode==='test'?5:1, Math.random()*60-30); 
                scene.add(e); enemies.push(e); 
            } 
        }

        function init() {
            scene = new THREE.Scene(); scene.background = new THREE.Color('#87CEEB'); 
            scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 
            const sun = new THREE.DirectionalLight(0xffffff, 1.2); 
            sun.position.set(50, 100, 50); scene.add(sun);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio); document.body.appendChild(renderer.domElement);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({color: '#4d7c0f'})); ground.rotation.x = -Math.PI/2; scene.add(ground);
            scene.add(new THREE.GridHelper(200, 40, 0xffffff, 0xffffff));
            player = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshStandardMaterial({color: '#fff'})); player.position.y = 1; player.userData = { vY: 0 }; scene.add(player);

            window.addEventListener('touchstart', (e) => { 
                const joy = document.getElementById('joy-con').getBoundingClientRect(); 
                for(let t of e.changedTouches) { 
                    if(Math.sqrt(Math.pow(t.clientX-(joy.left+45),2)+Math.pow(t.clientY-(joy.top+45),2)) < 60) moveTouchId = t.identifier; 
                    else if(t.target.tagName !== 'BUTTON' && t.target.tagName !== 'INPUT') { 
                        lookTouchId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY; 
                    } 
                } 
            });

            window.addEventListener('touchmove', (e) => { 
                for(let t of e.changedTouches) { 
                    if(t.identifier === moveTouchId) { 
                        const rect = document.getElementById('joy-con').getBoundingClientRect(); 
                        const dx = t.clientX-(rect.left+45), dy = t.clientY-(rect.top+45), a = Math.atan2(dy, dx), dist = Math.min(Math.sqrt(dx*dx+dy*dy), 35); 
                        document.getElementById('joy-knob').style.transform = `translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px)`; 
                        moveVector.x = (Math.cos(a)*dist)/35; moveVector.z = (Math.sin(a)*dist)/35; 
                    } else if(t.identifier === lookTouchId) { 
                        yaw -= (t.clientX - lastLookX) * sensitivity; 
                        // Pitch limits adjusted for high sky / slight ground
                        pitch = Math.max(-1.4, Math.min(0.4, pitch + (t.clientY - lastLookY) * sensitivity)); 
                        lastLookX = t.clientX; lastLookY = t.clientY; 
                    } 
                } 
            }, {passive: false});

            window.addEventListener('touchend', (e) => { 
                for(let t of e.changedTouches) { 
                    if(t.identifier === moveTouchId) { moveTouchId = null; moveVector = {x:0,z:0}; document.getElementById('joy-knob').style.transform = ''; } 
                    if(t.identifier === lookTouchId) lookTouchId = null; 
                } 
            });

            window.addEventListener('resize', () => { 
                camera.aspect = window.innerWidth / window.innerHeight; 
                camera.updateProjectionMatrix(); 
                renderer.setSize(window.innerWidth, window.innerHeight); 
            });

            setInterval(() => { if(mc < 50) mc++; updateBars(); }, 800); 
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isDashing) { 
                player.position.add(dashDir.clone().multiplyScalar(1.2)); 
                if(--dashTime <= 0) isDashing = false; 
            }
            else if(moveTouchId !== null) { 
                player.position.add(new THREE.Vector3(moveVector.x, 0, moveVector.z).applyAxisAngle(new THREE.Vector3(0,1,0), yaw).multiplyScalar(0.28)); 
            }
            player.position.x = Math.max(-98, Math.min(98, player.position.x)); player.position.z = Math.max(-98, Math.min(98, player.position.z));
            player.position.y += player.userData.vY; if(player.position.y > 1) player.userData.vY -= 0.02; else { player.position.y = 1; player.userData.vY = 0; }
            
            dashTrails.forEach((t, i) => { 
                t.m.position.copy(player.position.clone().add(t.m.userData.offset)); 
                t.m.lookAt(t.m.position.clone().add(t.m.userData.direction)); 
                t.m.material.opacity = --t.life / 12; 
                if(t.life <= 0) { scene.remove(t.m); dashTrails.splice(i, 1); } 
            });

            projectiles.forEach((p, i) => { 
                p.position.add(p.userData.vel); 
                if(--p.userData.life <= 0 || p.position.y < -5) { scene.remove(p); projectiles.splice(i,1); } 
            });

            const r = 8; 
            camera.position.set(
                player.position.x + r * Math.cos(pitch) * Math.sin(yaw), 
                Math.max(1.1, player.position.y + r * Math.sin(pitch) + 1.2), 
                player.position.z + r * Math.cos(pitch) * Math.cos(yaw)
            );
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z); 
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
